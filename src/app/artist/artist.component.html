<div class="row">
  <div class="search">
      <h3>{{'ArtistComponent.title' | translate}}</h3>
      <form>
          <input type="text" [(ngModel)]= "artistName" name="artistName" placeholder="Nana Mouskouri">
          <button (click)="getArtist()" class="btn btn-light">{{'ArtistComponent.Rechercher' | translate}}</button>
      </form>   
  </div>
  <div class="display">
      <h3>{{'ArtistComponent.Vos artistes' | translate}}</h3>
      <div class="row">
  
          <!-- Liste d'artistes ajoutés aux favoris -->
          <div *ngFor="let artist of tabArtistes">
              <h4>{{ artist.name }}</h4>
              <img [src]="artist.imageUrl" [alt]="artist.name">
          <button [routerLink]="['/album',artist.id]">{{'ArtistComponent.Album' | translate}}</button>
          <button [routerLink]="['/show', artist.name]">{{'ArtistComponent.Concerts' | translate}}</button> 
          <button (click)="deleteArtist(artist.id)" class="btn btn-light">{{'ArtistComponent.Supprimer' | translate}}</button>    
      </div>
  </div>
  </div>
